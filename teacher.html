<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>통합과학2 수업용</title>
<style>
  :root { --ink: #222; --mute: #666; --line: #ddd; --a: #1F4FB8; --bg: #fafaf8; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 28px; margin: 0 0 8px; }
  p { line-height: 1.6; color: var(--mute); margin: 0 0 20px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { border-top: 1px solid var(--line); }
  li:last-child { border-bottom: 1px solid var(--line); }
  a { display: block; padding: 16px 4px; color: var(--ink); text-decoration: none; font-size: 20px; }
  a:hover, a:focus { color: var(--a); }
  small { display: block; color: var(--mute); font-size: 15px; margin-top: 4px; }
</style>
</head>
<body>
<main>
  <h1>통합과학2 수업용</h1>
  <p>수업 시간에 여는 화면입니다. 「실시간」을 누르면 코드와 QR이 나오고, 학생은 QR을 찍어 들어옵니다.</p>
  <ul>
    <!-- 차시를 올릴 때마다 한 줄씩 더함 -->
  </ul>
</main>
</body>
</html>
